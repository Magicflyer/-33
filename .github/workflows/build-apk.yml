name: Build APK

# 每次推送到 main/master、打 v* 标签，或在 Actions 页面手动点击，都会构建出一个可安装的 APK。
# 不需要本地装 Android Studio。

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 项目在 gradle/gradle-daemon-jvm.properties 里指定了 toolchainVersion=25，
      # 所以这里必须用 JDK 25，否则 Gradle 会尝试自己下载 JDK 而拖慢甚至失败。
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 只能用 foss 变体：googlePlay 变体的源码不在公开仓库里。
      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleFossDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/foss/debug/app-foss-debug.apk dist/getabreak-debug.apk
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: getabreak-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

  # 打 v* 标签时，额外把 APK 挂到 Release 上，方便长期保存和直接分享链接。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: getabreak-apk
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
